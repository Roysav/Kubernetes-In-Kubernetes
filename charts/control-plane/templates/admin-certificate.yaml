apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "common.fullname" . }}-admin
spec:
  secretName: {{ include "common.fullname" . }}-admin
  commonName: admin
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: {{ include "common.release.fullname" . }}
    kind: Issuer
    group: cert-manager.io
  subject:
    organizations:
      - system:masters
  usages:
    - digital signature
    - key encipherment
    - client auth