apiVersion: v1
kind: Pod
metadata:
  name: {{ include "common.fullname" . }}-smoke-test
  annotations:
    helm.sh/hook: test
spec:

  containers:
    - name: kubectl
      image: {{ .Values.smokeTest.image }}
      command:
        - /bin/sh
        - -c
        - |-
          kubectl config set-cluster kubernetes-the-hard-way \
            --certificate-authority=/var/lib/kubernetes/ca.crt \
            --embed-certs=true \
            --server=https://{{ include "common.fullname" (get .Subcharts "kube-apiserver") }}:6443 \
            --kubeconfig=admin.kubeconfig

          kubectl config set-credentials admin \
            --client-certificate=/var/lib/kubernetes/tls.crt \
            --client-key=/var/lib/kubernetes/tls.key \
            --embed-certs=true \
            --kubeconfig=admin.kubeconfig

          kubectl config set-context default \
            --cluster=kubernetes-the-hard-way \
            --user=admin \
            --kubeconfig=admin.kubeconfig

          kubectl config use-context default \
            --kubeconfig=admin.kubeconfig


          cat admin.kubeconfig
          kubectl --kubeconfig=admin.kubeconfig --context default get ns
      workingDir: /wd
      volumeMounts:
        - name: kubernetes
          mountPath: /var/lib/kubernetes

        - name: wd
          mountPath: /wd
  volumes:
    - name: kubernetes
      projected:
        sources:
          - secret:
              items:
                - path: tls.key
                  key: tls.key
                - path: tls.crt
                  key: tls.crt
              name: {{ include "common.fullname" . }}-admin
          - secret:
              name: {{ include "common.release.fullname" . }}-root-ca
              items:
                - path: ca.crt
                  key: ca.crt



    - name: wd
      emptyDir: {}

  restartPolicy: Never


