kube-controller-manager:
  image:
    repository: kube-controller-manager

  command:
    - kube-controller-manager

  args:
    - --bind-address=0.0.0.0
    - --cluster-name=$(RELEASE_NAME)
    - --cluster-signing-cert-file=/etc/ssl/ca/tls.crt
    - --cluster-signing-key-file=/etc/ssl/ca/tls.key
    - --root-ca-file=/etc/ssl/ca/ca.crt
    - --service-account-private-key-file=/etc/ssl/service-accounts/tls.key
    - --kubeconfig=/etc/.kube/config
    - --service-cluster-ip-range=10.32.0.0/24
    - --use-service-account-credentials=true
    - --v=2

  kubeConfig:
    enabled: true
    user: system:kube-controller-manager

  env:
    - name: KUBECONFIG
      value: /etc/.kube/config

    - name: RELEASE_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.labels['app.kubernetes.io/instance']

  volumeMounts:
    - name: kube-controller-manager-certificate
      mountPath: /etc/ssl/kubernetes

    - name: service-accounts-certificate
      mountPath: /etc/ssl/service-accounts

    - name: kubeconfig
      mountPath: /etc/.kube

    - name: root-ca-certificate
      mountPath: /etc/ssl/ca


  certificates:
    - root-ca
    - kube-controller-manager
    - service-accounts
